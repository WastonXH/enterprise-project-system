<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务部 | 企业项目管理系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body><script src="form-enhancement.js"></script>
    <header>
        <div class="container">
            <a href="index.html" class="back-btn">← 返回首页</a>
            <div class="header-title">
                <h1>💼 业务部工作台</h1>
                <p>项目需求录入</p>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="form-card">
            <div class="card-header">
                <h2>➕ 新增项目需求</h2>
                <p>请填写完整的项目需求信息，所有标记为 * 的字段为必填项</p>
            </div>
            
            <form>
                <div class="form-section">
                    <h3>📋 基础信息</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>业务组别 <span class="required">*</span></label>
                            <input type="text" placeholder="例如：华东区一组" required>
                        </div>
                        <div class="form-group">
                            <label>客户名称 <span class="required">*</span></label>
                            <input type="text" placeholder="例如：华为技术有限公司" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>📐 项目需求</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>尺寸</label>
                            <input type="text" placeholder="例如：15.6英寸">
                        </div>
                        <div class="form-group">
                            <label>分辨率</label>
                            <input type="text" placeholder="例如：1920×1080">
                        </div>
                    </div>
                   <!-- 技术类别 -->
<div class="form-section">
    <label for="productCategory">技术类别 *</label>
    <select id="productCategory" name="productCategory" required onchange="handleProductCategoryChange()">
        <option value="">请选择技术类别</option>
        <option value="tft_ips">TFT-LCD（IPS）</option>
        <option value="tft_tn">TFT-LCD(TN)</option>
        <option value="tft_va">TFT-LCD(VA,MVA,PLS)</option>
        <option value="oled">OLED</option>
        <option value="mono_lcd">MONO-LCD（单色液晶）</option>
        <option value="e_paper">E-PAPER</option>
        <option value="other">其它</option>
    </select>
</div>

<!-- 当选择"其它"技术类别时显示的输入框 -->
<div class="form-section" id="otherProductCategorySection" style="display: none;">
    <label for="otherProductCategory">请填写具体技术类别 *</label>
    <input type="text" id="otherProductCategory" name="otherProductCategory" placeholder="请输入具体技术类别">
</div>

<!-- 项目等级 -->
<div class="form-section">
    <label for="projectLevel">项目等级 *</label>
    <select id="projectLevel" name="projectLevel" required>
        <option value="">请选择项目等级</option>
        <option value="S级">S级</option>
        <option value="A级">A级</option>
        <option value="B级">B级</option>
        <option value="C级">C级</option>
        <option value="D级">D级</option>
    </select>
</div>

<!-- 产品结构 -->
<div class="form-section">
    <label for="productStructure">产品结构 *</label>
    <select id="productStructure" name="productStructure" required onchange="handleProductStructureChange()">
        <option value="">请选择产品结构</option>
        <option value="s_lcm">S-LCM（单模组，FOG+背光）</option>
        <option value="t_lcm">T-LCM（TP/LENS+LCM）</option>
        <option value="p_lcm">P-LCM（S-LCM+PCBA）</option>
        <option value="a_lcm">A-LCM(总成，如LCM+盖板+PCBA)</option>
        <option value="fog">FOG</option>
        <option value="fob">FOB</option>
        <option value="other">其它</option>
    </select>
</div>

<!-- 当选择"其它"产品结构时显示的输入框 -->
<div class="form-section" id="otherProductStructureSection" style="display: none;">
    <label for="otherProductStructure">请填写具体产品结构 *</label>
    <input type="text" id="otherProductStructure" name="otherProductStructure" placeholder="请输入具体产品结构">
</div>

<!-- 应用类别 -->
<div class="form-section">
    <label for="applicationCategory">应用类别 *</label>
    <select id="applicationCategory" name="applicationCategory" required onchange="handleApplicationCategoryChange()">
        <option value="">请选择应用类别</option>
        <option value="vehicle_pre">车载前装</option>
        <option value="vehicle_after">车载后装</option>
        <option value="industrial">工控</option>
        <option value="medical">医疗</option>
        <option value="appliance">家电</option>
        <option value="commercial">商业</option>
        <option value="other">其它</option>
    </select>
</div>

<!-- 当选择"其它"应用类别时显示的输入框 -->
<div class="form-section" id="otherApplicationSection" style="display: none;">
    <label for="otherApplication">请填写具体应用 *</label>
    <input type="text" id="otherApplication" name="otherApplication" placeholder="请输入具体应用内容">
</div>

<!-- 出图要求 -->
<div class="form-section">
    <label for="drawingRequirement">出图要求 *</label>
    <select id="drawingRequirement" name="drawingRequirement" required>
        <option value="">请选择出图要求</option>
        <option value="仅报价评估">仅报价评估</option>
        <option value="立项评估">立项评估</option>
    </select>
</div>
                <div class="form-section">
                    <h3>📝 项目基本信息及要求</h3>
                    <div class="form-group">
                        <label>详细信息</label>
                        <textarea placeholder="请详细描述项目的基本信息、技术要求、交付时间、特殊要求等..." rows="6"></textarea>
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="index.html" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary">💾 提交项目需求</button>
                </div>
            </form>
        </div>
        
        <div class="info-card">
            <h3>💡 提示</h3>
            <p>这是演示版本，表单功能需要完整的后端支持。您可以查看界面布局和字段设计。</p>
        </div>
    </main>
</body>
</html>
