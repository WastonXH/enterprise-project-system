<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购部 | 企业项目管理系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body><script src="form-enhancement.js"></script>
    <header>
        <div class="container">
            <a href="index.html" class="back-btn">← 返回首页</a>
            <div class="header-title">
                <h1>📦 采购部工作台</h1>
                <p>资源库管理</p>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="tabs">
            <button class="tab-btn active">🔷 玻璃资源库</button>
            <button class="tab-btn">🔶 IC资源库</button>
        </div>
        
        <div class="form-card">
            <div class="card-header">
                <h2>➕ 添加玻璃资源</h2>
                <p>添加新的玻璃型号到资源库，供研发部选型使用</p>
            </div>
            
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label>玻璃型号 <span class="required">*</span></label>
                        <input type="text" placeholder="例如：LCM-G-156-001" required>
                    </div>
                    <div class="form-group">
                        <label>厂家</label>
                        <input type="text" placeholder="例如：京东方">
                    </div>
                </div>
                <div class="form-group">
                    <label>规格说明</label>
                    <textarea placeholder="请描述玻璃的规格参数，例如：15.6英寸、IPS、1920×1080" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>库存状态</label>
                        <select>
                            <option value="充足">充足</option>
                            <option value="紧张">紧张</option>
                            <option value="缺货">缺货</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <input type="text" placeholder="其他说明信息">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">➕ 添加玻璃资源</button>
                </div>
            </form>
        </div>
        
        <div class="table-card">
            <div class="card-header">
                <h2>📋 玻璃资源列表</h2>
                <p>当前资源库中的所有玻璃型号</p>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>型号</th>
                            <th>厂家</th>
                            <th>规格说明</th>
                            <th>库存状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>LCM-G-156-001</td>
                            <td>京东方</td>
                            <td>15.6英寸 IPS 1920×1080</td>
                            <td><span class="status-badge status-ok">充足</span></td>
                            <td><button class="btn-small btn-danger">删除</button></td>
                        </tr>
                        <tr>
                            <td>LCM-G-065-002</td>
                            <td>夏普</td>
                            <td>6.5英寸 OLED 2340×1080</td>
                            <td><span class="status-badge status-warning">紧张</span></td>
                            <td><button class="btn-small btn-danger">删除</button></td>
                        </tr>
                        <tr>
                            <td>LCM-G-270-003</td>
                            <td>三星</td>
                            <td>27英寸 IPS 4K</td>
                            <td><span class="status-badge status-ok">充足</span></td>
                            <td><button class="btn-small btn-danger">删除</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="info-card">
            <h3>💡 提示</h3>
            <p>这是演示版本，数据为静态展示。实际使用时需要后端API支持数据的增删改查功能。</p>
        </div>
    </main>
</body>
</html>
