<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发部工作台 - 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input:focus {
            outline: none;
            border-color: #667eea;
        }

        .select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-item:hover {
            background: #f0f0f0;
        }

        .radio-item.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        .dynamic-input {
            margin-top: 10px;
            display: none;
        }

        .dynamic-input.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subsection {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .subsection-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: inline-block;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .hidden {
            display: none;
        }

        .show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 6px;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-title {
            font-weight: 600;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .result-content {
            color: #388e3c;
            line-height: 1.6;
        }

        .info-box {
            margin-top: 20px;
            padding: 20px;
            background: #e3f2fd;
            border: 2px solid #2196f3;
            border-radius: 6px;
        }

        .info-title {
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 10px;
        }

        .info-content {
            color: #0d47a1;
            line-height: 1.6;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .flex-group {
            display: flex;
            gap: 10px;
        }

        .flex-group .select {
            flex: 1;
        }

        .flex-group .input {
            flex: 2;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            .header {
                padding: 20px;
            }
            .content {
                padding: 20px;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 研发部工作台</h1>
            <p>设计方案与型号生成</p>
        </div>

        <div class="content">
            <!-- 项目选择 -->
            <div class="section">
                <h2 class="section-title">📋 选择项目需求</h2>
                
                <div class="form-group">
                    <label class="label">选择项目 <span style="color: red;">*</span></label>
                    <select class="select" id="projectSelect">
                        <option value="">请选择项目需求</option>
                        <option value="1">客户A - TFT-LCD (10.1英寸)</option>
                        <option value="2">客户B - OLED (7.0英寸)</option>
                        <option value="3">客户C - S/TN_LCD (3.5英寸)</option>
                    </select>
                </div>

                <div id="projectInfo" class="info-box hidden">
                    <div class="info-title">项目信息</div>
                    <div class="info-content" id="projectDetails"></div>
                </div>
            </div>

            <!-- 核心组件选型 -->
            <div class="section">
                <h2 class="section-title">⚙️ 核心组件选型</h2>
                <p style="margin-bottom: 15px; color: #666;">从采购部资源库中选择或手动输入玻璃、IC、偏光片型号（二选一）</p>
                
                <!-- 玻璃型号 -->
                <div class="form-group">
                    <label class="label">玻璃型号 <span style="color: red;">*</span></label>
                    <div class="flex-group">
                        <select class="select" id="glassSelect">
                            <option value="">请选择玻璃</option>
                            <option value="manual">手动输入</option>
                            <option value="1">G-LCD10.1-01</option>
                            <option value="2">G-LCD7.0-02</option>
                            <option value="3">G-TFT3.5-03</option>
                        </select>
                        <input type="text" class="input" id="glassManualInput" placeholder="或输入玻璃型号">
                    </div>
                </div>

                <!-- IC型号 -->
                <div class="form-group">
                    <label class="label">IC型号 <span style="color: red;">*</span></label>
                    <div class="flex-group">
                        <select class="select" id="icSelect">
                            <option value="">请选择IC</option>
                            <option value="manual">手动输入</option>
                            <option value="1">IC-ILI9488</option>
                            <option value="2">IC-SSD1963</option>
                            <option value="3">IC-ST7789</option>
                        </select>
                        <input type="text" class="input" id="icManualInput" placeholder="或输入IC型号">
                    </div>
                </div>

                <!-- 偏光片类型 -->
                <div class="form-group">
                    <label class="label">偏光片类型 <span style="color: red;">*</span></label>
                    <div class="flex-group">
                        <select class="select" id="polarizerSelect">
                            <option value="">请选择偏光片类型</option>
                            <option value="普通型">普通型</option>
                            <option value="广视角型">广视角型</option>
                            <option value="高对比度型">高对比度型</option>
                            <option value="低反射型">低反射型</option>
                            <option value="特殊应用型">特殊应用型</option>
                        </select>
                        <input type="text" class="input" id="polarizerManualInput" placeholder="或输入自定义偏光片">
                    </div>
                </div>

                <!-- 产品型号预览 -->
                <div id="modelPreview" class="info-box hidden">
                    <div class="info-title">🎯 生成产品型号</div>
                    <div class="info-content" style="font-size: 24px; font-weight: bold;" id="generatedModel"></div>
                </div>
            </div>

            <!-- FPC和背光配置 -->
            <div class="section">
                <h2 class="section-title">🔌 FPC & 背光配置</h2>
                
                <!-- FPC配置 -->
                <div class="form-group">
                    <label class="label">FPC型号</label>
                    <div class="flex-group">
                        <input type="text" class="input" id="fpcModel" placeholder="请输入FPC型号" style="flex: 2;">
                        <select class="select" id="fpcType" style="flex: 1;">
                            <option value="">类型</option>
                            <option value="共用型号">共用型号</option>
                            <option value="新开">新开</option>
                        </select>
                    </div>
                </div>

                <!-- 背光配置 -->
                <div class="form-group">
                    <label class="label">背光型号</label>
                    <div class="flex-group">
                        <input type="text" class="input" id="backlightModel" placeholder="请输入背光型号" style="flex: 2;">
                        <select class="select" id="backlightType" style="flex: 1;">
                            <option value="">类型</option>
                            <option value="共用型号">共用型号</option>
                            <option value="新开">新开</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 触摸屏配置 -->
            <div class="section">
                <h2 class="section-title">📱 触控及盖板配置</h2>
                
                <div class="form-group">
                    <label class="label">触摸屏方案选择</label>
                    <div class="radio-group" id="modeSelector">
                        <div class="radio-item selected" data-value="multi-select">
                            <input type="radio" name="touchscreenMode" value="multi-select" checked>
                            <span>触控/盖板方案（多选）</span>
                        </div>
                        <div class="radio-item" data-value="resistive">
                            <input type="radio" name="touchscreenMode" value="resistive">
                            <span>电阻触摸屏型号（填写）</span>
                        </div>
                    </div>
                </div>

                <!-- 电阻触摸屏型号 -->
                <div id="resistiveSection" class="hidden">
                    <div class="form-group">
                        <label class="label">电阻触摸屏型号：</label>
                        <input type="text" class="input" id="resistiveModel" placeholder="请输入电阻触摸屏型号">
                    </div>
                </div>

                <!-- 触控/盖板方案（多选） -->
                <div id="multiSelectSection" class="show">
                    <div class="form-group">
                        <label class="label">触控/盖板方案（可多选）：</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" name="touchscreenType" value="盖板规格">
                                <span>盖板规格</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="touchscreenType" value="电容触控IC 方案">
                                <span>电容触控IC 方案</span>
                            </label>
                        </div>
                    </div>

                    <!-- 盖板规格配置 -->
                    <div id="coverSpecSection" class="subsection hidden">
                        <h3 class="subsection-title">盖板规格配置</h3>
                        
                        <div class="form-group">
                            <label class="label">a. 触控Sensor 材质和结构：</label>
                            <div class="radio-group">
                                <label class="radio-item">
                                    <input type="radio" name="coverMaterial" value="GG">
                                    <span>GG</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="coverMaterial" value="GFF">
                                    <span>GFF</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="coverMaterial" value="OGS">
                                    <span>OGS</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="coverMaterial" value="其它">
                                    <span>其它</span>
                                </label>
                            </div>
                            <div class="dynamic-input" id="coverMaterialOtherDiv">
                                <input type="text" class="input" id="coverMaterialOther" placeholder="请说明">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="label">b. 盖板及表面处理：</label>
                            <div class="form-group">
                                <label class="label">厚度：</label>
                                <input type="text" class="input" id="coverThickness" placeholder="例如：0.55mm">
                            </div>
                            <div class="form-group">
                                <label class="label">表面处理（可多选）：</label>
                                <div class="checkbox-group">
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="surfaceTreatment" value="AG">
                                        <span>AG</span>
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="surfaceTreatment" value="AR">
                                        <span>AR</span>
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="surfaceTreatment" value="AF">
                                        <span>AF</span>
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="surfaceTreatment" value="抗UV">
                                        <span>抗UV</span>
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="surfaceTreatment" value="其它（填写）">
                                        <span>其它（填写）</span>
                                    </label>
                                </div>
                                <div class="dynamic-input" id="surfaceTreatmentOtherDiv">
                                    <input type="text" class="input" id="surfaceTreatmentOther" placeholder="请说明">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 电容触控IC方案配置 -->
                    <div id="capacitiveSection" class="subsection hidden">
                        <h3 class="subsection-title">电容触控IC 方案配置</h3>
                        
                        <div class="form-group">
                            <label class="label">a. 触控IC特性（可多选）：</label>
                            <div class="checkbox-group">
                                <label class="checkbox-item">
                                    <input type="checkbox" name="capacitiveFeature" value="触控IC (填写)">
                                    <span>触控IC (填写)</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="capacitiveFeature" value="防水">
                                    <span>防水</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="capacitiveFeature" value="手套">
                                    <span>手套</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="capacitiveFeature" value="主/被动笔">
                                    <span>主/被动笔</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="capacitiveFeature" value="触控点数（填写）">
                                    <span>触控点数（填写）</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="capacitiveFeature" value="其它">
                                    <span>其它</span>
                                </label>
                            </div>
                            
                            <!-- 动态输入框 -->
                            <div class="dynamic-input" id="capacitiveICDiv">
                                <input type="text" class="input" id="capacitiveIC" placeholder="请输入触控IC型号">
                            </div>
                            <div class="dynamic-input" id="capacitivePointsDiv">
                                <input type="number" class="input" id="capacitivePoints" placeholder="例如：10">
                            </div>
                            <div class="dynamic-input" id="capacitiveFeatureOtherDiv">
                                <input type="text" class="input" id="capacitiveFeatureOther" placeholder="请说明">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="label">b. 特殊要求（可多选）：</label>
                            <div class="checkbox-group">
                                <label class="checkbox-item">
                                    <input type="checkbox" name="specialRequirement" value="连接器型号及品牌">
                                    <span>连接器型号及品牌</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="specialRequirement" value="其它">
                                    <span>其它</span>
                                </label>
                            </div>
                            <div class="dynamic-input" id="connectorModelDiv">
                                <input type="text" class="input" id="connectorModel" placeholder="请输入连接器型号及品牌">
                            </div>
                            <div class="dynamic-input" id="specialRequirementOtherDiv">
                                <input type="text" class="input" id="specialRequirementOther" placeholder="请说明">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 提交按钮 -->
            <button class="btn" onclick="submitForm()">💾 保存设计方案</button>

            <!-- 结果显示 -->
            <div id="resultBox" class="result-box">
                <div class="result-title">✅ 配置已保存</div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        // 项目选择
        const projectSelect = document.getElementById('projectSelect');
        const projectInfo = document.getElementById('projectInfo');
        const projectDetails = document.getElementById('projectDetails');

        const projectData = {
            '1': { customer: '客户A', category: 'TFT-LCD', size: '10.1英寸', level: 'S' },
            '2': { customer: '客户B', category: 'OLED', size: '7.0英寸', level: 'A' },
            '3': { customer: '客户C', category: 'S/TN_LCD', size: '3.5英寸', level: 'B' }
        };

        projectSelect.addEventListener('change', function() {
            const projectId = this.value;
            if (projectId && projectData[projectId]) {
                const project = projectData[projectId];
                projectDetails.innerHTML = `
                    <div class="grid-2">
                        <div><strong>客户:</strong> ${project.customer}</div>
                        <div><strong>类别:</strong> ${project.category}</div>
                        <div><strong>尺寸:</strong> ${project.size}</div>
                        <div><strong>等级:</strong> ${project.level}</div>
                    </div>
                `;
                projectInfo.classList.remove('hidden');
                projectInfo.classList.add('show');
            } else {
                projectInfo.classList.add('hidden');
            }
            generateModel();
        });

        // 核心组件选择
        const glassSelect = document.getElementById('glassSelect');
        const glassManualInput = document.getElementById('glassManualInput');
        const icSelect = document.getElementById('icSelect');
        const icManualInput = document.getElementById('icManualInput');
        const modelPreview = document.getElementById('modelPreview');
        const generatedModel = document.getElementById('generatedModel');

        function generateModel() {
            const projectId = projectSelect.value;
            const glassCode = glassSelect.value === 'manual' ? glassManualInput.value : 
                             (glassSelect.value ? (glassSelect.options[glassSelect.selectedIndex].text.split('-')[1] || '') : '');
            const icCode = icSelect.value === 'manual' ? icManualInput.value : 
                          (icSelect.value ? (icSelect.options[icSelect.selectedIndex].text.split('-')[1] || '') : '');

            if (projectId && (glassCode || (glassSelect.value === 'manual' && glassManualInput.value)) && 
                (icCode || (icSelect.value === 'manual' && icManualInput.value))) {
                const project = projectData[projectId];
                const category = project.category.replace('-', '');
                const model = `LCM-${category}-${project.size}-${glassCode || glassManualInput.value}-${icCode || icManualInput.value}`;
                generatedModel.textContent = model;
                modelPreview.classList.remove('hidden');
                modelPreview.classList.add('show');
            } else {
                modelPreview.classList.add('hidden');
            }
        }

        glassSelect.addEventListener('change', generateModel);
        glassManualInput.addEventListener('input', generateModel);
        icSelect.addEventListener('change', generateModel);
        icManualInput.addEventListener('input', generateModel);

        // 模式切换逻辑
        const modeSelector = document.getElementById('modeSelector');
        const resistiveSection = document.getElementById('resistiveSection');
        const multiSelectSection = document.getElementById('multiSelectSection');

        modeSelector.addEventListener('click', function(e) {
            const radioItem = e.target.closest('.radio-item');
            if (!radioItem) return;

            document.querySelectorAll('#modeSelector .radio-item').forEach(item => {
                item.classList.remove('selected');
            });
            radioItem.classList.add('selected');

            const mode = radioItem.dataset.value;
            if (mode === 'resistive') {
                resistiveSection.classList.remove('hidden');
                resistiveSection.classList.add('show');
                multiSelectSection.classList.add('hidden');
                multiSelectSection.classList.remove('show');
            } else {
                resistiveSection.classList.add('hidden');
                resistiveSection.classList.remove('show');
                multiSelectSection.classList.remove('hidden');
                multiSelectSection.classList.add('show');
            }
        });

        // 触控/盖板方案多选逻辑
        const touchscreenTypeCheckboxes = document.querySelectorAll('input[name="touchscreenType"]');
        const coverSpecSection = document.getElementById('coverSpecSection');
        const capacitiveSection = document.getElementById('capacitiveSection');

        function updateSections() {
            const selectedTypes = Array.from(touchscreenTypeCheckboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            if (selectedTypes.includes('盖板规格')) {
                coverSpecSection.classList.remove('hidden');
                coverSpecSection.classList.add('show');
            } else {
                coverSpecSection.classList.add('hidden');
                coverSpecSection.classList.remove('show');
            }

            if (selectedTypes.includes('电容触控IC 方案')) {
                capacitiveSection.classList.remove('hidden');
                capacitiveSection.classList.add('show');
            } else {
                capacitiveSection.classList.add('hidden');
                capacitiveSection.classList.remove('show');
            }
        }

        touchscreenTypeCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', updateSections);
        });

        // 盖板材质选择逻辑
        const coverMaterialRadios = document.querySelectorAll('input[name="coverMaterial"]');
        const coverMaterialOtherDiv = document.getElementById('coverMaterialOtherDiv');

        coverMaterialRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === '其它') {
                    coverMaterialOtherDiv.classList.add('show');
                } else {
                    coverMaterialOtherDiv.classList.remove('show');
                }
            });
        });

        // 表面处理"其它"输入框
        const surfaceTreatmentOtherCheckbox = document.querySelector('input[name="surfaceTreatment"][value="其它（填写）"]');
        const surfaceTreatmentOtherDiv = document.getElementById('surfaceTreatmentOtherDiv');

        if (surfaceTreatmentOtherCheckbox) {
            surfaceTreatmentOtherCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    surfaceTreatmentOtherDiv.classList.add('show');
                } else {
                    surfaceTreatmentOtherDiv.classList.remove('show');
                }
            });
        }

        // 电容触控IC特性动态输入框
        const capacitiveFeatureCheckboxes = document.querySelectorAll('input[name="capacitiveFeature"]');
        const capacitiveICDiv = document.getElementById('capacitiveICDiv');
        const capacitivePointsDiv = document.getElementById('capacitivePointsDiv');
        const capacitiveFeatureOtherDiv = document.getElementById('capacitiveFeatureOtherDiv');

        capacitiveFeatureCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const checkedValues = Array.from(document.querySelectorAll('input[name="capacitiveFeature"]:checked'))
                    .map(cb => cb.value);

                capacitiveICDiv.classList.toggle('show', checkedValues.includes('触控IC (填写)'));
                capacitivePointsDiv.classList.toggle('show', checkedValues.includes('触控点数（填写）'));
                capacitiveFeatureOtherDiv.classList.toggle('show', checkedValues.includes('其它'));
            });
        });

        // 特殊要求动态输入框
        const specialRequirementCheckboxes = document.querySelectorAll('input[name="specialRequirement"]');
        const connectorModelDiv = document.getElementById('connectorModelDiv');
        const specialRequirementOtherDiv = document.getElementById('specialRequirementOtherDiv');

        specialRequirementCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const checkedValues = Array.from(document.querySelectorAll('input[name="specialRequirement"]:checked'))
                    .map(cb => cb.value);

                connectorModelDiv.classList.toggle('show', checkedValues.includes('连接器型号及品牌'));
                specialRequirementOtherDiv.classList.toggle('show', checkedValues.includes('其它'));
            });
        });

        // 提交表单
        function submitForm() {
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            
            // 获取选中的项目
            const projectId = projectSelect.value;
            const project = projectData[projectId];
            
            let config = `<strong>📋 项目信息：</strong><br>`;
            config += `客户：${project ? project.customer : '未选择'}<br>`;
            config += `类别：${project ? project.category : '未选择'}<br>`;
            config += `尺寸：${project ? project.size : '未选择'}<br><br>`;

            // 获取核心组件
            const glassModel = glassSelect.value === 'manual' ? glassManualInput.value : 
                              (glassSelect.value ? glassSelect.options[glassSelect.selectedIndex].text : '');
            const icModel = icSelect.value === 'manual' ? icManualInput.value : 
                          (icSelect.value ? icSelect.options[icSelect.selectedIndex].text : '');
            
            config += `<strong>⚙️ 核心组件：</strong><br>`;
            config += `玻璃型号：${glassModel || '未填写'}<br>`;
            config += `IC型号：${icModel || '未填写'}<br>`;
            config += `偏光片：${document.getElementById('polarizerSelect').value || document.getElementById('polarizerManualInput').value || '未填写'}<br><br>`;

            // FPC和背光
            config += `<strong>🔌 FPC & 背光：</strong><br>`;
            config += `FPC型号：${document.getElementById('fpcModel').value || '未填写'}<br>`;
            config += `FPC类型：${document.getElementById('fpcType').value || '未选择'}<br>`;
            config += `背光型号：${document.getElementById('backlightModel').value || '未填写'}<br>`;
            config += `背光类型：${document.getElementById('backlightType').value || '未选择'}<br><br>`;

            // 触摸屏配置
            const mode = document.querySelector('input[name="touchscreenMode"]:checked').value;
            config += `<strong>📱 触摸屏配置：</strong><br>`;
            
            if (mode === 'resistive') {
                const resistiveModel = document.getElementById('resistiveModel').value;
                config += `方案类型：电阻触摸屏型号（填写）<br>`;
                config += `电阻触摸屏型号：${resistiveModel || '未填写'}<br>`;
            } else {
                config += `方案类型：触控/盖板方案（多选）<br>`;
                
                const selectedTypes = Array.from(document.querySelectorAll('input[name="touchscreenType"]:checked'))
                    .map(cb => cb.value);
                config += `已选方案：${selectedTypes.join(', ') || '无'}<br><br>`;

                // 盖板规格
                if (selectedTypes.includes('盖板规格')) {
                    const coverMaterial = document.querySelector('input[name="coverMaterial"]:checked')?.value || '未选择';
                    const coverMaterialOther = document.getElementById('coverMaterialOther').value;
                    const coverThickness = document.getElementById('coverThickness').value;
                    const surfaceTreatments = Array.from(document.querySelectorAll('input[name="surfaceTreatment"]:checked'))
                        .map(cb => cb.value);
                    const surfaceTreatmentOther = document.getElementById('surfaceTreatmentOther').value;

                    config += `<strong>盖板规格配置：</strong><br>`;
                    config += `- 盖板材质：${coverMaterial}${coverMaterial === '其它' ? ` (${coverMaterialOther})` : ''}<br>`;
                    config += `- 厚度：${coverThickness || '未填写'}<br>`;
                    config += `- 表面处理：${surfaceTreatments.join(', ') || '无'}${surfaceTreatments.includes('其它（填写）') ? ` (${surfaceTreatmentOther})` : ''}<br><br>`;
                }

                // 电容触控IC方案
                if (selectedTypes.includes('电容触控IC 方案')) {
                    const capacitiveFeatures = Array.from(document.querySelectorAll('input[name="capacitiveFeature"]:checked'))
                        .map(cb => cb.value);
                    const capacitiveIC = document.getElementById('capacitiveIC').value;
                    const capacitivePoints = document.getElementById('capacitivePoints').value;
                    const capacitiveFeatureOther = document.getElementById('capacitiveFeatureOther').value;
                    const specialRequirements = Array.from(document.querySelectorAll('input[name="specialRequirement"]:checked'))
                        .map(cb => cb.value);
                    const connectorModel = document.getElementById('connectorModel').value;
                    const specialRequirementOther = document.getElementById('specialRequirementOther').value;

                    config += `<strong>电容触控IC方案配置：</strong><br>`;
                    config += `- 触控IC特性：${capacitiveFeatures.join(', ') || '无'}<br>`;
                    if (capacitiveFeatures.includes('触控IC (填写)')) {
                        config += `- 触控IC型号：${capacitiveIC || '未填写'}<br>`;
                    }
                    if (capacitiveFeatures.includes('触控点数（填写）')) {
                        config += `- 触控点数：${capacitivePoints || '未填写'}<br>`;
                    }
                    if (capacitiveFeatures.includes('其它')) {
                        config += `- 其它说明：${capacitiveFeatureOther || '未填写'}<br>`;
                    }
                    config += `- 特殊要求：${specialRequirements.join(', ') || '无'}<br>`;
                    if (specialRequirements.includes('连接器型号及品牌')) {
                        config += `- 连接器型号及品牌：${connectorModel || '未填写'}<br>`;
                    }
                    if (specialRequirements.includes('其它')) {
                        config += `- 其它说明：${specialRequirementOther || '未填写'}<br>`;
                    }
                }
            }

            // 产品型号
            if (modelPreview.classList.contains('show')) {
                config += `<br><strong>🎯 生成产品型号：</strong><br>${generatedModel.textContent}<br>`;
            }

            resultContent.innerHTML = config;
            resultBox.classList.add('show');
            
            resultBox.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
