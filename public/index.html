<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业项目管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .departments {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .dept-card {
            padding: 30px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s;
            background: #fafafa;
        }

        .dept-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
            background: white;
        }

        .dept-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .dept-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .dept-desc {
            font-size: 14px;
            color: #666;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 10px;
        }

        .badge.ready {
            background: #28a745;
        }

        .badge.demo {
            background: #ffc107;
            color: #333;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 企业项目管理系统</h1>
        <p class="subtitle">多部门协作平台 - 静态演示版</p>

        <div class="departments">
            <a href="business.html" class="dept-card">
                <div class="dept-icon">📋</div>
                <div class="dept-name">业务部</div>
                <div class="dept-desc">项目需求录入与管理</div>
                <span class="badge ready">✓ 已完成</span>
            </a>

            <a href="rd.html" class="dept-card">
                <div class="dept-icon">🔬</div>
                <div class="dept-name">研发部</div>
                <div class="dept-desc">设计方案与型号生成</div>
                <span class="badge ready">✓ 已完成</span>
            </a>

            <a href="#" class="dept-card" onclick="alert('采购部页面开发中...'); return false;">
                <div class="dept-icon">🛒</div>
                <div class="dept-name">采购部</div>
                <div class="dept-desc">资源管理与采购</div>
                <span class="badge demo">开发中</span>
            </a>

            <a href="#" class="dept-card" onclick="alert('质量部页面开发中...'); return false;">
                <div class="dept-icon">✅</div>
                <div class="dept-name">质量部</div>
                <div class="dept-desc">质量记录与追溯</div>
                <span class="badge demo">开发中</span>
            </a>
        </div>

        <div class="footer">
            <p>💡 当前为静态演示版 | 后续将连接数据库并提供完整功能</p>
            <p style="margin-top: 10px; font-size: 12px;">部署平台：Netlify | 代码托管：GitHub</p>
        </div>
    </div>
</body>
</html>
