<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务部工作台 - 项目需求录入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .required {
            color: red;
        }

        .input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input:focus {
            outline: none;
            border-color: #667eea;
        }

        .select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .temp-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .temp-input {
            flex: 1;
        }

        .temp-label {
            color: #666;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
            margin-right: 10px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .success-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
            border-radius: 8px;
        }

        .success-box.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .success-icon {
            width: 50px;
            height: 50px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-right: 15px;
        }

        .success-title {
            font-size: 20px;
            font-weight: 600;
            color: #155724;
        }

        .success-info {
            color: #155724;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .requirement-id {
            font-weight: bold;
            color: #28a745;
        }

        .print-tip {
            color: #155724;
            font-size: 14px;
            font-style: italic;
        }

        /* A-LCM 相关样式 */
        .alcm-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .alcm-section.show {
            display: block;
        }

        /* 打印样式 */
        @media print {
            /* 隐藏主界面 */
            body > .container {
                display: none !important;
            }

            /* 显示打印模板 */
            .print-template {
                display: block !important;
                position: relative;
                width: 100%;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                font-family: "SimSun", "宋体", serif;
                font-size: 12pt;
                line-height: 1.6;
                color: #000;
                background: #fff;
            }

            /* 打印抬头 */
            .print-header {
                text-align: center;
                margin-bottom: 30px;
                padding-bottom: 20px;
                border-bottom: 2px solid #000;
            }

            .print-header h1 {
                font-size: 24pt;
                font-weight: bold;
                margin: 0 0 20px 0;
                color: #000;
            }

            .print-info {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin-top: 15px;
                font-size: 12pt;
            }

            .print-info-item {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .print-info-item .label {
                font-weight: bold;
            }

            .print-info-item .value {
                font-weight: normal;
            }

            /* 打印表格 */
            .print-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 20px;
            }

            .print-table td {
                border: 1px solid #000;
                padding: 10px 12px;
                vertical-align: middle;
            }

            .print-table .section-label {
                background-color: #f0f0f0;
                font-weight: bold;
                font-size: 13pt;
                text-align: left;
                padding: 12px;
            }

            .print-table .field-label {
                background-color: #fafafa;
                font-weight: bold;
                width: 15%;
                white-space: nowrap;
            }

            .print-table .field-value {
                background-color: #fff;
                width: 35%;
            }

            /* 页面设置 */
            @page {
                size: A4;
                margin: 20mm 15mm;
            }

            body {
                margin: 0;
                padding: 0;
            }

            /* 强制打印背景色 */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* 正常浏览时隐藏打印模板 */
        .print-template {
            display: none;
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .temp-group {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <!-- 主界面容器 -->
    <div class="container no-print">
        <div class="header">
            <h1>📋 业务部工作台</h1>
            <p>项目需求录入</p>
        </div>

        <div class="content">
            <form id="businessForm">
                <!-- 基础信息 -->
                <div class="section">
                    <h2 class="section-title">基础信息</h2>
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="label">业务组别 <span class="required">*</span></label>
                            <input type="text" class="input" id="businessGroup" placeholder="例如：华东区一组" required>
                        </div>
                        <div class="form-group">
                            <label class="label">客户名称 <span class="required">*</span></label>
                            <input type="text" class="input" id="customerName" placeholder="例如：华为技术有限公司" required>
                        </div>
                    </div>
                </div>

                <!-- 项目需求 -->
                <div class="section">
                    <h2 class="section-title">项目需求</h2>
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="label">尺寸</label>
                            <input type="text" class="input" id="size" placeholder="例如：15.6英寸">
                        </div>
                        <div class="form-group">
                            <label class="label">分辨率</label>
                            <input type="text" class="input" id="resolution" placeholder="例如：1920×1080">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="label">技术类别 <span class="required">*</span></label>
                            <select class="select" id="productCategory" required>
                                <option value="">请选择技术类别</option>
                                <option value="tft_ips">TFT-LCD（IPS）</option>
                                <option value="tft_tn">TFT-LCD(TN)</option>
                                <option value="tft_va">TFT-LCD(VA,MVA,PLS)</option>
                                <option value="oled">OLED</option>
                                <option value="stn_lcd">S/TN_LCD(被动型液晶显示)</option>
                                <option value="e_paper">E-PAPER</option>
                                <option value="other">其它</option>
                            </select>
                        </div>
                        <div class="form-group" id="otherCategoryGroup" style="display: none;">
                            <label class="label">请填写具体技术类别 <span class="required">*</span></label>
                            <input type="text" class="input" id="otherProductCategory" placeholder="请输入具体技术类别">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="label">产品结构 <span class="required">*</span></label>
                            <select class="select" id="productStructure" required>
                                <option value="">请选择产品结构</option>
                                <option value="s_lcm">S-LCM（单模组，FOG+背光，可含铁框）</option>
                                <option value="t_lcm">T-LCM（TP/LENS+LCM）</option>
                                <option value="p_lcm">P-LCM（S-LCM+PCBA）</option>
                                <option value="a_lcm">A-LCM(总成，如LCM+盖板+PCBA)</option>
                                <option value="fog">FOG</option>
                                <option value="fob">FOB</option>
                                <option value="other">其它</option>
                            </select>
                        </div>
                        <div class="form-group" id="otherStructureGroup" style="display: none;">
                            <label class="label">请填写具体产品结构 <span class="required">*</span></label>
                            <input type="text" class="input" id="otherProductStructure" placeholder="请输入具体产品结构">
                        </div>
                    </div>

                    <!-- A-LCM组合式总成 -->
                    <div class="alcm-section" id="alcmSection">
                        <h3 style="margin-bottom: 15px; color: #667eea;">组合式总成A-LCM</h3>
                        <p style="margin-bottom: 15px; color: #666;">您已选择A-LCM，请勾选相关组件：</p>
                        
                        <div class="checkbox-group" style="margin-bottom: 20px;">
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="cover_glass">
                                <span>盖板玻璃</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="touch_panel">
                                <span>触摸屏（TP）</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="frame">
                                <span>铁框</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="pcba">
                                <span>PCBA</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="backlight">
                                <span>背光</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="s_lcm">
                                <span>S-LCM</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="fog">
                                <span>FOG</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="fob">
                                <span>FOB</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" name="alcmComponent" value="other_component">
                                <span>其它</span>
                            </label>
                        </div>

                        <div class="form-group" id="otherComponentGroup" style="display: none;">
                            <label class="label">请填写其它组件 <span class="required">*</span></label>
                            <input type="text" class="input" id="alcmOtherComponent" placeholder="请输入其它组件名称">
                        </div>

                        <div class="form-group">
                            <label class="label">A-LCM组合说明 <span class="required">*</span></label>
                            <textarea class="textarea" id="alcmDescription" placeholder="请详细描述A-LCM的组合方式、规格要求、特殊要求等..." rows="4"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 其他需求 -->
                <div class="section">
                    <h2 class="section-title">其他需求</h2>
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="label">项目等级 <span class="required">*</span></label>
                            <select class="select" id="projectLevel" required>
                                <option value="">请选择项目等级</option>
                                <option value="S级">S级</option>
                                <option value="A级">A级</option>
                                <option value="B级">B级</option>
                                <option value="C级">C级</option>
                                <option value="D级">D级</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="label">出图要求 <span class="required">*</span></label>
                            <select class="select" id="drawingRequirement" required>
                                <option value="">请选择出图要求</option>
                                <option value="仅报价评估">仅报价评估</option>
                                <option value="立项评估">立项评估</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="label">应用类别 <span class="required">*</span></label>
                        <select class="select" id="applicationCategory" required>
                            <option value="">请选择应用类别</option>
                            <option value="vehicle_pre">车载前装</option>
                            <option value="vehicle_after">车载后装</option>
                            <option value="industrial">工控</option>
                            <option value="medical">医疗</option>
                            <option value="appliance">家电</option>
                            <option value="commercial">商业</option>
                            <option value="other">其它</option>
                        </select>
                    </div>
                    <div class="form-group" id="otherApplicationGroup" style="display: none;">
                        <label class="label">请填写具体应用 <span class="required">*</span></label>
                        <input type="text" class="input" id="otherApplication" placeholder="请输入具体应用内容">
                    </div>
                </div>

                <!-- 产品规格 -->
                <div class="section">
                    <h2 class="section-title">产品规格</h2>
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="label">亮度要求</label>
                            <input type="text" class="input" id="brightness" placeholder="例如：500">
                            <p style="font-size: 12px; color: #666; margin-top: 5px;">单位：cd/m²</p>
                        </div>
                        <div class="form-group">
                            <label class="label">对比度要求</label>
                            <input type="text" class="input" id="contrastRatio" placeholder="例如：1000:1">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="label">工作温度要求 <span class="required">*</span></label>
                            <div class="temp-group">
                                <input type="text" class="input temp-input" id="workTempLow" placeholder="低温">
                                <span class="temp-label">°C</span>
                                <span class="temp-label">~</span>
                                <input type="text" class="input temp-input" id="workTempHigh" placeholder="高温">
                                <span class="temp-label">°C</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="label">存储温度要求 <span class="required">*</span></label>
                            <div class="temp-group">
                                <input type="text" class="input temp-input" id="storageTempLow" placeholder="低温">
                                <span class="temp-label">°C</span>
                                <span class="temp-label">~</span>
                                <input type="text" class="input temp-input" id="storageTempHigh" placeholder="高温">
                                <span class="temp-label">°C</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="label">产品应用</label>
                        <textarea class="textarea" id="productApplication" placeholder="请描述产品的应用场景，例如：智能手机、平板电脑、车载显示器等" rows="3"></textarea>
                    </div>
                </div>

                <!-- 项目基本信息及要求 -->
                <div class="section">
                    <h2 class="section-title">项目基本信息及要求</h2>
                    <div class="form-group">
                        <textarea class="textarea" id="basicInfo" placeholder="请详细描述项目的基本信息、技术要求、交付时间、特殊要求等..." rows="6"></textarea>
                    </div>
                </div>

                <!-- 提交按钮 -->
                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">取消</button>
                    <button type="submit" class="btn btn-primary">💾 提交项目需求</button>
                </div>
            </form>

            <!-- 成功提示框 -->
            <div class="success-box" id="successBox">
                <div class="success-header">
                    <div style="display: flex; align-items: center;">
                        <div class="success-icon">✓</div>
                        <div>
                            <div class="success-title">提交成功！</div>
                            <div class="success-info">
                                需求编号：<span class="requirement-id" id="requirementId"></span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="handlePrint()">🖨️ 打印/预览</button>
                        <button class="btn btn-secondary" onclick="newRequirement()" style="margin-left: 10px;">新建需求</button>
                    </div>
                </div>
                <p class="print-tip">💡 提示：点击"打印/预览"按钮，在打印对话框中选择"另存为PDF"即可保存为PDF文档</p>
            </div>
        </div>
    </div>

    <!-- 打印模板（仅在打印时显示） -->
    <div class="print-template">
        <!-- 抬头 -->
        <div class="print-header">
            <h1>项目需求表</h1>
            <div class="print-info">
                <div class="print-info-item">
                    <span class="label">需求编号：</span>
                    <span class="value" id="printRequirementId"></span>
                </div>
                <div class="print-info-item">
                    <span class="label">提交日期：</span>
                    <span class="value" id="printDate"></span>
                </div>
            </div>
        </div>

        <!-- 表单内容 -->
        <table class="print-table" id="printTable">
            <tbody>
                <!-- 内容将由JavaScript动态生成 -->
            </tbody>
        </table>
    </div>

    <script>
        // 表单数据
        let formData = {};

        // 生成需求编号
        function generateRequirementId() {
            const year = new Date().getFullYear().toString().slice(-2);
            const storageKey = 'requirementSequenceNumber';
            let sequence = parseInt(localStorage.getItem(storageKey) || '0');
            
            sequence = (sequence + 1) % 100000;
            localStorage.setItem(storageKey, sequence.toString());
            
            const sequenceStr = sequence.toString().padStart(5, '0');
            return `${year}-${sequenceStr}`;
        }

        // 获取标签文本
        function getCategoryLabel(value) {
            const categories = {
                'tft_ips': 'TFT-LCD（IPS）',
                'tft_tn': 'TFT-LCD(TN)',
                'tft_va': 'TFT-LCD(VA,MVA,PLS)',
                'oled': 'OLED',
                'stn_lcd': 'S/TN_LCD(被动型液晶显示)',
                'e_paper': 'E-PAPER',
                'other': formData.otherProductCategory || '其它'
            };
            return categories[value] || '-';
        }

        function getStructureLabel(value) {
            const structures = {
                's_lcm': 'S-LCM（单模组，FOG+背光，可含铁框）',
                't_lcm': 'T-LCM（TP/LENS+LCM）',
                'p_lcm': 'P-LCM（S-LCM+PCBA）',
                'a_lcm': 'A-LCM(总成，如LCM+盖板+PCBA)',
                'fog': 'FOG',
                'fob': 'FOB',
                'other': formData.otherProductStructure || '其它'
            };
            return structures[value] || '-';
        }

        function getApplicationLabel(value) {
            const applications = {
                'vehicle_pre': '车载前装',
                'vehicle_after': '车载后装',
                'industrial': '工控',
                'medical': '医疗',
                'appliance': '家电',
                'commercial': '商业',
                'other': formData.otherApplication || '其它'
            };
            return applications[value] || '-';
        }

        function getALcmComponentLabels() {
            const components = {
                'cover_glass': '盖板玻璃',
                'touch_panel': '触摸屏（TP）',
                'frame': '铁框',
                'pcba': 'PCBA',
                'backlight': '背光',
                's_lcm': 'S-LCM',
                'fog': 'FOG',
                'fob': 'FOB',
                'other_component': formData.alcmOtherComponent || '其它'
            };
            
            const checkboxes = document.querySelectorAll('input[name="alcmComponent"]:checked');
            const labels = Array.from(checkboxes).map(cb => components[cb.value] || cb.value);
            return labels.join('、') || '-';
        }

        // 表单提交
        document.getElementById('businessForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 收集表单数据
            formData = {
                businessGroup: document.getElementById('businessGroup').value,
                customerName: document.getElementById('customerName').value,
                size: document.getElementById('size').value,
                resolution: document.getElementById('resolution').value,
                productCategory: document.getElementById('productCategory').value,
                otherProductCategory: document.getElementById('otherProductCategory').value,
                productStructure: document.getElementById('productStructure').value,
                otherProductStructure: document.getElementById('otherProductStructure').value,
                projectLevel: document.getElementById('projectLevel').value,
                drawingRequirement: document.getElementById('drawingRequirement').value,
                applicationCategory: document.getElementById('applicationCategory').value,
                otherApplication: document.getElementById('otherApplication').value,
                brightness: document.getElementById('brightness').value,
                contrastRatio: document.getElementById('contrastRatio').value,
                workTempLow: document.getElementById('workTempLow').value,
                workTempHigh: document.getElementById('workTempHigh').value,
                storageTempLow: document.getElementById('storageTempLow').value,
                storageTempHigh: document.getElementById('storageTempHigh').value,
                productApplication: document.getElementById('productApplication').value,
                basicInfo: document.getElementById('basicInfo').value,
                alcmComponents: Array.from(document.querySelectorAll('input[name="alcmComponent"]:checked')).map(cb => cb.value),
                alcmOtherComponent: document.getElementById('alcmOtherComponent').value,
                alcmDescription: document.getElementById('alcmDescription').value
            };

            // 生成需求编号
            const requirementId = generateRequirementId();
            document.getElementById('requirementId').textContent = requirementId;
            document.getElementById('printRequirementId').textContent = requirementId;
            document.getElementById('printDate').textContent = new Date().toLocaleDateString('zh-CN');

            // 生成打印表格
            generatePrintTable(formData);

            // 显示成功提示
            document.getElementById('successBox').classList.add('show');
            document.getElementById('businessForm').style.display = 'none';
        });

        // 生成打印表格
        function generatePrintTable(data) {
            const tbody = document.querySelector('#printTable tbody');
            tbody.innerHTML = `
                <!-- 基础信息 -->
                <tr>
                    <td class="section-label" colspan="4">基础信息</td>
                </tr>
                <tr>
                    <td class="field-label">业务组别</td>
                    <td class="field-value">${data.businessGroup || '-'}</td>
                    <td class="field-label">客户名称</td>
                    <td class="field-value">${data.customerName || '-'}</td>
                </tr>

                <!-- 项目需求 -->
                <tr>
                    <td class="section-label" colspan="4">项目需求</td>
                </tr>
                <tr>
                    <td class="field-label">尺寸</td>
                    <td class="field-value">${data.size || '-'}</td>
                    <td class="field-label">分辨率</td>
                    <td class="field-value">${data.resolution || '-'}</td>
                </tr>
                <tr>
                    <td class="field-label">技术类别</td>
                    <td class="field-value" colspan="3">${getCategoryLabel(data.productCategory)}</td>
                </tr>
                <tr>
                    <td class="field-label">产品结构</td>
                    <td class="field-value" colspan="3">${getStructureLabel(data.productStructure)}</td>
                </tr>
                ${data.productStructure === 'a_lcm' || data.alcmComponents.length > 0 ? `
                <tr>
                    <td class="field-label">A-LCM组件</td>
                    <td class="field-value" colspan="3">${getALcmComponentLabels()}</td>
                </tr>
                <tr>
                    <td class="field-label">A-LCM说明</td>
                    <td class="field-value" colspan="3">${data.alcmDescription || '-'}</td>
                </tr>
                ` : ''}

                <!-- 其他需求 -->
                <tr>
                    <td class="section-label" colspan="4">其他需求</td>
                </tr>
                <tr>
                    <td class="field-label">项目等级</td>
                    <td class="field-value">${data.projectLevel || '-'}</td>
                    <td class="field-label">出图要求</td>
                    <td class="field-value">${data.drawingRequirement || '-'}</td>
                </tr>
                <tr>
                    <td class="field-label">应用类别</td>
                    <td class="field-value" colspan="3">${getApplicationLabel(data.applicationCategory)}</td>
                </tr>

                <!-- 产品规格 -->
                <tr>
                    <td class="section-label" colspan="4">产品规格</td>
                </tr>
                <tr>
                    <td class="field-label">亮度要求</td>
                    <td class="field-value">${data.brightness ? data.brightness + ' cd/m²' : '-'}</td>
                    <td class="field-label">对比度要求</td>
                    <td class="field-value">${data.contrastRatio || '-'}</td>
                </tr>
                <tr>
                    <td class="field-label">工作温度</td>
                    <td class="field-value">${data.workTempLow && data.workTempHigh ? data.workTempLow + '°C ~ ' + data.workTempHigh + '°C' : '-'}</td>
                    <td class="field-label">存储温度</td>
                    <td class="field-value">${data.storageTempLow && data.storageTempHigh ? data.storageTempLow + '°C ~ ' + data.storageTempHigh + '°C' : '-'}</td>
                </tr>
                <tr>
                    <td class="field-label">产品应用</td>
                    <td class="field-value" colspan="3">${data.productApplication || '-'}</td>
                </tr>

                <!-- 项目基本信息及要求 -->
                <tr>
                    <td class="section-label" colspan="4">项目基本信息及要求</td>
                </tr>
                <tr>
                    <td class="field-value" colspan="4" style="min-height: 150px; white-space: pre-wrap; line-height: 1.8;">
                        ${data.basicInfo || '-'}
                    </td>
                </tr>
            `;
        }

        // 打印功能
        function handlePrint() {
            window.print();
        }

        // 新建需求
        function newRequirement() {
            document.getElementById('successBox').classList.remove('show');
            document.getElementById('businessForm').style.display = 'block';
            document.getElementById('businessForm').reset();
            
            // 重置显示状态
            document.getElementById('otherCategoryGroup').style.display = 'none';
            document.getElementById('otherStructureGroup').style.display = 'none';
            document.getElementById('otherApplicationGroup').style.display = 'none';
            document.getElementById('alcmSection').classList.remove('show');
            document.getElementById('otherComponentGroup').style.display = 'none';
            
            formData = {};
        }

        // 重置表单
        function resetForm() {
            if (confirm('确定要取消吗？所有填写的内容将被清空。')) {
                document.getElementById('businessForm').reset();
                document.getElementById('otherCategoryGroup').style.display = 'none';
                document.getElementById('otherStructureGroup').style.display = 'none';
                document.getElementById('otherApplicationGroup').style.display = 'none';
                document.getElementById('alcmSection').classList.remove('show');
                document.getElementById('otherComponentGroup').style.display = 'none';
                formData = {};
            }
        }

        // 技术类别选择事件
        document.getElementById('productCategory').addEventListener('change', function() {
            document.getElementById('otherCategoryGroup').style.display = this.value === 'other' ? 'block' : 'none';
        });

        // 产品结构选择事件
        document.getElementById('productStructure').addEventListener('change', function() {
            document.getElementById('otherStructureGroup').style.display = this.value === 'other' ? 'block' : 'none';
            document.getElementById('alcmSection').classList.toggle('show', this.value === 'a_lcm');
        });

        // 应用类别选择事件
        document.getElementById('applicationCategory').addEventListener('change', function() {
            document.getElementById('otherApplicationGroup').style.display = this.value === 'other' ? 'block' : 'none';
        });

        // A-LCM组件选择事件
        document.querySelectorAll('input[name="alcmComponent"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const showOther = document.querySelector('input[name="alcmComponent"][value="other_component"]').checked;
                document.getElementById('otherComponentGroup').style.display = showOther ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
